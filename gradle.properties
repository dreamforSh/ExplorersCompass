# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true

# Parchment layers community-sourced parameter names and javadocs on top of the official mappings.
# Latest versions: https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Environment properties. The Minecraft version must agree with the NeoForge version.
# Latest versions: https://projects.neoforged.net/neoforged/neoforge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.244
neo_version_range=[21.1.0,)
# The loader version range can only use the major version of FML as bounds
loader_version_range=[4,)

## Mod properties

mod_id=explorerscompass
mod_name=Explorer's Compass
mod_license=CC BY-NC-SA 4.0
mod_version=1.21.1-neoforge-1.4.0
mod_group_id=com.chaosthedude.explorerscompass
mod_authors=ChaosTheDude

## Development-only dependencies

# Xaero's Minimap and World Map are reached purely through reflection, so nothing is ever compiled
# against them. These are only here so that the integration can be exercised in a dev run.
xaero_minimap_file_id=7412188
xaero_worldmap_file_id=8231071
