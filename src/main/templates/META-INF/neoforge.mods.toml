modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/MattCzyr/ExplorersCompass/issues"

[[mods]]
    modId="${mod_id}"
    version="${mod_version}"
    displayName="${mod_name}"
    displayURL="https://github.com/MattCzyr/ExplorersCompass"
    authors="${mod_authors}"
    description='''
    Search for and locate structures anywhere in the world.
    '''

# Opens up ChunkGeneratorStructureState#ringPositions so that a stronghold search can wait on the
# ring positions by yielding, rather than blocking the server thread inside getRingPositionsFor, and
# the parts of a placement's chunk check and of a structure's placement that a search works out for
# itself rather than asking the world for.
[[accessTransformers]]
    file="META-INF/accesstransformer.cfg"

# The terrain height cache and the two readers a structure preview is assembled through. See the
# mixin package for what each does and why an access transformer will not do instead.
[[mixins]]
    config="explorerscompass.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
