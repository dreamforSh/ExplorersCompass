plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id

base {
    // Keep the historical artifact name rather than taking the mod id, so that the published jar is
    // still ExplorersCompass-<version>.jar
    archivesName = 'ExplorersCompass'
}

// Mojang ships Java 21 to end users in 1.21.1, so the mod targets Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir 'src/generated/resources'
    exclude 'src/generated/**/.cache'
}

repositories {
    mavenCentral()
    maven {
        name = "CurseMaven"
        url = "https://cursemaven.com"
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
}

neoForge {
    version = neo_version

    parchment {
        mappingsVersion = parchment_mappings_version
        minecraftVersion = parchment_minecraft_version
    }

    // The access transformer is picked up automatically from
    // src/main/resources/META-INF/accesstransformer.cfg

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        // Launches GameTestServer, runs all registered gametests, then exits.
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            // "SCAN": mod scanning. "REGISTRIES": registry event firing. "REGISTRYDUMP": registry contents.
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    // Several tests touch Minecraft types (BlockPos, ResourceLocation), so JUnit needs the game on
    // its classpath.
    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

// A dependency that should be present when running the game in development, but that dependents of
// this mod must not inherit.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Xaero's Minimap and World Map are reached entirely through reflection (see
    // client/XaeroMinimapIntegration), so nothing here is ever compiled against. They are only
    // present so a dev run can exercise the waypoint integration.
    localRuntime "curse.maven:xaeros-minimap-263420:${xaero_minimap_file_id}"
    localRuntime "curse.maven:xaeros-world-map-317780:${xaero_worldmap_file_id}"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

// Expands the properties below into the mod metadata template, so that the versions are declared in
// exactly one place.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

jar {
    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : mod_authors,
                "Specification-Version"   : "1", // We are version 1 of ourselves
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : mod_authors,
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

test {
    useJUnitPlatform()
}

// IDEA no longer downloads sources/javadoc for dependencies unless asked to.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
